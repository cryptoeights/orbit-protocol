name: Contracts

on:
  push:
    branches: [main]
    paths: ["contracts/**", ".github/workflows/contracts.yml"]
  pull_request:
    paths: ["contracts/**", ".github/workflows/contracts.yml"]

defaults:
  run:
    working-directory: contracts

jobs:
  test:
    name: Build & Test (Soroban)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('contracts/Cargo.lock') }}

      - name: Build
        run: cargo build --workspace --locked

      - name: Test
        run: cargo test --workspace --locked

      # Style checks run but do not block yet — tighten to required once the
      # baseline is confirmed clean in CI.
      - name: Format check
        run: cargo fmt --all --check
        continue-on-error: true

      - name: Clippy
        run: cargo clippy --workspace --all-targets
        continue-on-error: true

  coverage:
    name: Coverage (>=80% target)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate coverage (lcov + summary)
        run: |
          cargo llvm-cov --workspace --locked --lcov --output-path lcov.info
          cargo llvm-cov --workspace --locked --summary-only

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: contracts/lcov.info
