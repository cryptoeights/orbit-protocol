<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- ORBIT "Constellation" mark on brand-black tile (DESIGN.md §1).
       Strokes are thicker than Logo.tsx so the mark stays legible at 16-32px. -->
  <defs>
    <linearGradient id="orbit-grad" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A78BFA" />
      <stop offset="1" stop-color="#7C3AED" />
    </linearGradient>
  </defs>
  <rect width="200" height="200" fill="#000000" />
  <ellipse cx="100" cy="100" rx="80" ry="30" transform="rotate(25 100 100)" fill="none" stroke="url(#orbit-grad)" stroke-width="14" />
  <ellipse cx="100" cy="100" rx="80" ry="30" transform="rotate(-25 100 100)" fill="none" stroke="url(#orbit-grad)" stroke-width="14" />
  <circle cx="100" cy="100" r="20" fill="url(#orbit-grad)" />
  <circle cx="172" cy="66" r="13" fill="#FFFFFF" />
  <circle cx="28" cy="134" r="9" fill="#FFFFFF" />
</svg>
