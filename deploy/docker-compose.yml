# ORBIT Protocol — production stack (frontend + api + postgres + redis).
#
# Exposes NO host ports. Public traffic arrives via the shared `web` network
# from the Cloudflare Tunnel (see deploy/cloudflared/). Run from this folder:
#
#   docker compose up -d --build
#
# First boot only — push the DB schema once Postgres is healthy:
#   docker compose run --rm api pnpm db:push
#
name: orbit

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks: [internal]

  api:
    build:
      context: ../api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      STELLAR_NETWORK: ${STELLAR_NETWORK}
      STELLAR_RPC_URL: ${STELLAR_RPC_URL}
      STELLAR_NETWORK_PASSPHRASE: ${STELLAR_NETWORK_PASSPHRASE}
      AGENT_REGISTRY_CONTRACT_ID: ${AGENT_REGISTRY_CONTRACT_ID}
      VERIFICATION_CONTRACT_ID: ${VERIFICATION_CONTRACT_ID}
      REPUTATION_CONTRACT_ID: ${REPUTATION_CONTRACT_ID}
      PASSPORT_CONTRACT_ID: ${PASSPORT_CONTRACT_ID}
      MULTI_WALLET_CONTRACT_ID: ${MULTI_WALLET_CONTRACT_ID}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # `internal` to reach db/redis, `web` so the tunnel can route api.<domain>.
    networks: [internal, web]

  frontend:
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_PRIVY_APP_ID: ${NEXT_PUBLIC_PRIVY_APP_ID}
        NEXT_PUBLIC_STELLAR_NETWORK: ${NEXT_PUBLIC_STELLAR_NETWORK}
    restart: unless-stopped
    depends_on: [api]
    networks: [web]

networks:
  internal:
  web:
    external: true

volumes:
  pgdata:
  redisdata:
